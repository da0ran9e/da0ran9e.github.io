<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="refresh" content="0; url=https://album.vuducan.qzz.io/" />
    <title>My Album</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        color: #171a1c;
        background: #f3f5f6;
      }

      main {
        display: grid;
        width: min(100% - 32px, 440px);
        gap: 12px;
        padding: 28px;
        border: 1px solid #cfd7da;
        border-radius: 4px;
        background: #ffffff;
      }

      span {
        color: #0a6d5b;
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: 24px;
      }

      p {
        color: #5c656a;
        font-size: 14px;
      }

      a {
        display: inline-flex;
        min-height: 40px;
        align-items: center;
        justify-content: center;
        margin-top: 8px;
        padding: 9px 14px;
        border-radius: 4px;
        color: #ffffff;
        background: #0a6d5b;
        font-size: 13px;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <span>Khu vực riêng tư</span>
      <h1>My Album</h1>
      <p>Đang chuyển tới trang đăng nhập bảo mật.</p>
      <a href="https://album.vuducan.qzz.io/">Tiếp tục</a>
    </main>
  </body>
</html>
