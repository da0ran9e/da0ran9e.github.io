<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="refresh" content="0; url=https://photos.vuducan.qzz.io/" />
    <link rel="canonical" href="https://photos.vuducan.qzz.io/" />
    <title>Đang mở My Album</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; }
      a { color: inherit; font-weight: 700; }
    </style>
    <script>
      const albumUrl = "https://photos.vuducan.qzz.io/";
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistration("./")
          .then((registration) => registration?.unregister())
          .finally(() => window.location.replace(albumUrl));
      } else {
        window.location.replace(albumUrl);
      }
    </script>
  </head>
  <body>
    <p>Đang mở <a href="https://photos.vuducan.qzz.io/">My Album</a>...</p>
  </body>
</html>
